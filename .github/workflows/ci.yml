name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the secret scan below.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Migration naming & schema validation
        run: npm run validate:migrations

      - name: Security invariant validation (RLS / payments / webhook / storage)
        run: npm run validate:security

      - name: Secret scan (git history + working tree)
        shell: bash
        run: |
          set -e
          # Scan full history and working tree for high-signal credential patterns.
          # Values are never printed — only file:line references.
          PATTERNS=(
            'sk_live_[A-Za-z0-9]{16,}'
            'pk_live_[A-Za-z0-9]{16,}'
            'rzp_live_[A-Za-z0-9]{10,}'
            'AIza[0-9A-Za-z_-]{30,}'
            'gh[pousr]_[A-Za-z0-9]{30,}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
            'SUPABASE_SERVICE_ROLE_KEY=eyJ'
            'SENTRY_AUTH_TOKEN=[A-Za-z0-9]{20,}'
          )
          FAIL=0
          for p in "${PATTERNS[@]}"; do
            if git grep -I -n -E "$p" $(git rev-list --all) -- . ':!package-lock.json' 2>/dev/null | head -5; then
              echo "::error::Potential secret matching pattern detected"
              FAIL=1
            fi
            if grep -RInE "$p" --exclude-dir=node_modules --exclude-dir=dist \
               --exclude-dir=.venv --exclude-dir=__pycache__ --exclude-dir=.pytest_cache --exclude-dir=.artifacts \
               --exclude=package-lock.json --exclude=.env* --exclude='*.env*' . 2>/dev/null | head -5; then
              echo "::error::Potential secret in working tree"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend unit tests
        run: npm test

      - name: Backend unit tests
        run: npm run test:backend

      - name: Dependency audit (high+ blocks merge)
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      # Playwright E2E is intentionally NOT run here: lifecycle specs require a
      # seeded external Supabase backend with portal tokens. Run `npm run test:e2e`
      # against a staging environment before release.
